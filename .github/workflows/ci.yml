name: TraceMap CI — prototype safety gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API/test dependencies
        run: python -m pip install -e './apps/api[test]'
      - name: Syntax and unit/integration tests
        run: python -m compileall -q apps/api/tracemap && python -m pytest -q apps/api/tests
      - name: Shell script syntax check
        run: for f in scripts/*.sh; do bash -n "$f"; done && echo "scripts OK"
      - name: Development deployment safety regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Generated OpenAPI contract has no drift
        run: python scripts/export_openapi.py --check
      - name: Synthetic evidence retrieval benchmark (informational timing)
        run: python scripts/benchmark_domain.py
      - name: Reject accidental production auth mode
        run: |
          python - <<'PY'
          import os,sys
          sys.path.insert(0, 'apps/api')
          from tracemap.main import create_app
          os.environ['TRACEMAP_ENV']='production'
          try: create_app('sqlite://')
          except RuntimeError: print('Production guard works')
          else: raise AssertionError('Development authentication is enabled in production')
          PY
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - name: Strict TS and production asset build
        run: npm run build
        working-directory: apps/web
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: python -m pip install -e './apps/api[test]'
      - name: Install browser client and Chromium
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end source/evidence/patch smoke
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload real Chromium UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracemap-ui-v0.2-previews
          path: apps/web/test-results/ui-*.png
          if-no-files-found: ignore
      - name: Upload browser debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug
          path: apps/web/test-results
          if-no-files-found: ignore

  deployment-lifecycle:
    runs-on: ubuntu-latest
    env:
      TRACEMAP_RUNTIME_DIR: /tmp/tracemap-deployment-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated API venv and dependencies
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e './apps/api[test]'
      - name: Install frontend lockfile dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Start and inspect loopback-only development services
        run: |
          scripts/dev-start.sh
          scripts/dev-status.sh
      - name: Smoke test and isolated restart/persistence cycle
        run: |
          scripts/smoke-test.sh
          scripts/smoke-test.sh --restart
      - name: Playwright must reject explicit shared database override
        working-directory: apps/web
        run: |
          if TRACEMAP_E2E_DATABASE_URL=sqlite:////tmp/tracemap-shared.db npx playwright test --list > /tmp/tracemap-db-override-rejection.log 2>&1; then
            echo "E2E unexpectedly accepted shared database override"
            exit 1
          fi
          grep -q "E2E database override is prohibited" /tmp/tracemap-db-override-rejection.log
      - name: Restart test must not mutate an inherited database URL
        run: |
          sentinel="$(mktemp -d /tmp/tracemap-sentinel.XXXXXX)"
          trap 'rm -rf -- "$sentinel"' EXIT
          python - "$sentinel/user.db" <<'PY'
          import sqlite3,sys
          db=sqlite3.connect(sys.argv[1])
          db.execute("CREATE TABLE sentinel (value TEXT NOT NULL)")
          db.execute("INSERT INTO sentinel VALUES ('unchanged')")
          db.commit()
          db.close()
          PY
          before="$(sha256sum "$sentinel/user.db" | cut -d' ' -f1)"
          TRACEMAP_DATABASE_URL="sqlite:///$sentinel/user.db" scripts/smoke-test.sh --restart
          after="$(sha256sum "$sentinel/user.db" | cut -d' ' -f1)"
          test "$before" = "$after" || { echo "Restart smoke modified inherited database"; exit 1; }
          echo "Inherited database sentinel unchanged"
      - name: Stop and verify service lifecycle
        run: |
          scripts/dev-stop.sh
          scripts/dev-stop.sh
      - name: Always attempt safe cleanup
        if: always()
        run: scripts/dev-stop.sh || true
      - name: Upload synthetic deployment logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracemap-linux-lifecycle-debug
          path: /tmp/tracemap-deployment-${{ github.run_id }}-${{ github.run_attempt }}/logs
          if-no-files-found: ignore
